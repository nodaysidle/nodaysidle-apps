  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  <!-- lap-distance baseline -->
  <path d="M104 352 H408" stroke="#ffffff" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>
  <!-- speed trace over one lap: a long straight, a heavy braking zone, two corners, a flat-out exit -->
